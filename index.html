<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>碰撞機器人 v1.06</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Ricochet Robots <span style="font-size: 0.5em;">v1.06</span></h1>
            <div id="target-display">目前目標：<span id="current-target-name">載入中...</span></div>
        </header>

        <div id="board-wrapper">
            <div id="game-board"></div>
        </div>

        <footer>
            <div class="controls">
                <button id="reset-btn">重新開始</button>
                <button id="back-to-start-btn">返回起點</button>
            </div>
            <p id="move-counter">步數：0</p>
        </footer>
    </div>

    <script>
        function logLoad(name) { console.log(`[OK] ${name} 已載入`); }
    </script>

    <script src="js/data/boards.js" onload="logLoad('boards.js')"></script>
    <script src="js/data/targets.js" onload="logLoad('targets.js')"></script>
    <script src="utils/map-generator.js" onload="logLoad('map-generator.js')"></script>
    <script src="js/engine.js" onload="logLoad('engine.js')"></script>
    <script src="js/renderer.js" onload="logLoad('renderer.js')"></script>
    <script src="js/main.js" onload="logLoad('main.js')"></script>
</body>
</html>
